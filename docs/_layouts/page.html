---
layout: default
---

<section class="page-hero">
  <div class="container page-hero-grid">
    <div>
      <p class="eyebrow">SIGNAL Lab</p>
      <h1>{{ page.title }}</h1>
    </div>

    <div class="page-hero-logo-wrap">
      <img
        src="{{ site.baseurl }}/assets/images/logo/signal-logo.jpeg"
        alt="SIGNAL Lab logo"
        class="page-hero-logo"
      >
    </div>
  </div>
</section>

<section class="page-content">
  <div class="container narrow">
    {{ content }}
  </div>
</section>
