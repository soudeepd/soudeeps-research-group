<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="site-title" href="{{ site.baseurl }}/">SIGNAL Lab</a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ site.baseurl }}/research/">Research</a>
        <a href="{{ site.baseurl }}/consulting/">Consulting</a>
        <a href="{{ site.baseurl }}/resources/">Resources</a>
        <a href="{{ site.baseurl }}/members/">Members</a>
        <a href="{{ site.baseurl }}/alumni/">Alumni</a>
        <a href="{{ site.baseurl }}/news/">News</a>
        <a href="{{ site.baseurl }}/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <strong>SIGNAL Lab of Prof. Soudeep Deb</strong>
        <p>Decision Sciences Area  
          Indian Institute of Management Bangalore  
          Bannerghatta Road, Bengaluru, KA 560076, India. </p>
      </div>
    </div>
  </footer>
</body>
</html>
