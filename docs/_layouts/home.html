---
layout: default
---

<section class="hero compact-hero">
  <div class="container compact-hero-grid">

    <div class="hero-copy">
      <p class="eyebrow">Prof. Soudeep Deb's</p>
      <h1>SIGNAL Lab</h1>

      <p class="hero-text compact-hero-text">
        <strong>S</strong>tatistical <strong>I</strong>nnovation and
        <strong>G</strong>uidance for <strong>N</strong>ovel
        <strong>A</strong>nalytics and <strong>L</strong>earning
      </p>
    </div>

    <div class="hero-side">
      <img
        src="{{ site.baseurl }}/assets/images/logo/signal-logo.jpeg"
        alt="SIGNAL Lab logo"
        class="compact-hero-logo"
      >

      <div class="hero-actions compact-hero-actions">
        <a class="button primary" href="{{ site.baseurl }}/research/">Explore research</a>
        <a class="button primary" href="{{ site.baseurl }}/contact/">Contact us</a>
      </div>
    </div>

    <div class="compact-theme-strip">
      <span class="theme-label">IIM Bangalore</span>
      <span class="theme-label">Decision Sciences</span>
      <span class="theme-label">Research Group</span>
    </div>

  </div>
</section>

<section class="home-photo-section">
  <div class="container">
    <img
      src="{{ site.baseurl }}/assets/images/home/signal-lab-collage.png"
      alt="SIGNAL Lab group collage"
      class="home-feature-photo"
    >
  </div>
</section>

<section class="section">

    {{ content }}
  </div>
</section>
